name: Release APK

# 打 v* 的 tag 就出包。版本名取 tag(去掉前导 v),版本号取流水线序号 ——
# 每次发布都有更大的 versionCode,已装的用户才能覆盖安装。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 准备 Android SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "platforms: $(ls "$ANDROID_HOME/platforms")"

      # 先跑测试:测试挂了就不该出包
      - name: 纯逻辑单测
        run: sh gradlew :app:testDebugUnitTest

      - name: 写入并校验签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 secret KEYSTORE_BASE64" >&2
            exit 1
          fi
          # 先去 CR,再删掉 ----- 开头的 PEM 标记行。
          # 不要只用 base64 -d -i:PEM 标记里的字母本身就是合法 base64 字符,会让数据流错位。
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r' | sed '/^-----/d' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore 字节数: $(wc -c < "$RUNNER_TEMP/release.jks")"
          if ! "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "密钥库校验失败。常见原因:" >&2
            echo "  1) KEYSTORE_BASE64 不是 keystore 文件的 base64(例如填成了文件路径或别的内容)" >&2
            echo "  2) KEYSTORE_PASSWORD 与生成时不一致" >&2
            echo "  3) KEY_ALIAS 与生成时的 -alias 不一致" >&2
            exit 1
          fi
          echo "密钥库与别名校验通过"

      - name: 计算版本名
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 构建签名 release APK
        env:
          NEKOTODO_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          NEKOTODO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NEKOTODO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NEKOTODO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NEKOTODO_VERSION_NAME: ${{ env.VERSION_NAME }}
          NEKOTODO_VERSION_CODE: ${{ github.run_number }}
        run: sh gradlew :app:assembleRelease

      # 确认真的签过名:未签名的包在 Android 上根本装不上
      - name: 校验签名
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | head -4

      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSET="NekoTodo-android-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          gh release create "$TAG" --title "NekoTodo Android ${TAG}" --generate-notes "$ASSET"
